<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Layer 1 – Kode</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Figtree:wght@400;500&family=Pinyon+Script&family=Caveat:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="card" id="card">
  <img class="lock" id="lock" src="assets/img/gembok.png" alt="">
  <div class="keywrap" id="kw"><img class="key" id="key" src="assets/img/kunci.png" alt=""></div>
  <img class="tassel" src="assets/img/kuncir.png" alt="">
  <h1 id="msg">apa yaa kode nyaa</h1>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
</main>
<div class="fx" id="fx"></div>
<section class="scene" id="l2">
  <div class="sglow" id="sglow"></div>
  <div class="stage">
    <div class="enter" id="l2enter" role="button" tabindex="0" aria-label="Ketuk untuk membuka buku">
      <div class="float" id="l2float"><div class="fit" id="l2fit"><div class="book">
        <div class="pgs"></div>
        <div class="cover"><img class="front" draggable="false" alt="" src="assets/img/buku-sampul.png"><div class="ttl">Untuk Dhini</div><div class="cin"></div></div>
      </div></div></div>
    </div>
    <div class="hint" id="l2hint">Ketuk untuk membuka 🌸</div>
  </div>
  <div class="field" id="field"></div>
  <div class="sflash" id="sflash"></div>
</section>
<div id="curtain"></div>
<section class="layer2" id="l3s">
  <span class="ok">yeay, kodenya benar 💗</span>
  <div class="l2box" id="l2box">
    <h2 id="q">Apa yang makin dibagi, makin bertambah?</h2>
    <input id="ans" type="text" placeholder="ketik jawabanmu…" autocomplete="off" autocapitalize="none" aria-label="jawaban">
    <button type="button" id="go">Jawab</button>
    <small id="hint"></small>
    <button type="button" class="link" id="hbtn">minta petunjuk</button>
  </div>
  <div class="l2box" id="l3" style="display:none"><h2>yeay, jawabanmu benar 💗</h2><small>Layer 3 dimulai di sini</small></div>
  <div class="l3" id="l3stage">
    <div class="l3bg"></div><div class="l3warm" id="l3warm"></div><div class="l3dim" id="l3dim"></div><div class="l3end" id="l3end"></div><div class="l4" id="l4"></div>
    <div class="l3garland"><img src="assets/img/garland.webp" alt=""></div>
    <div class="l3main">
      <div class="cakewrap" id="cakewrap">
        <div class="cglow" id="cglow"><i></i></div>
        <img class="cake" src="assets/img/kue.webp" alt="Kue ulang tahun">
        <div class="mt" id="mt"><img src="assets/img/mt.webp" alt=""><div class="flame mflame" id="mflame"><div class="fshr"><svg viewBox="0 0 40 80" aria-hidden="true"><defs><linearGradient id="fgm" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff8f2a"/><stop offset=".55" stop-color="#ffb84a"/><stop offset="1" stop-color="#ffe7a2"/></linearGradient></defs><path d="M20 2C22 18 38 34 38 54C38 68 30 78 20 78C10 78 2 68 2 54C2 34 18 18 20 2Z" fill="url(#fgm)"/><path d="M20 32C21 43 29 51 29 61C29 69 25 74 20 74C15 74 11 69 11 61C11 51 19 43 20 32Z" fill="#fff6dc" opacity=".92"/></svg></div></div></div>
        <div class="flame" id="cflame"><div class="fshr"><svg viewBox="0 0 40 80" aria-hidden="true"><defs><linearGradient id="fgc" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff8f2a"/><stop offset=".55" stop-color="#ffb84a"/><stop offset="1" stop-color="#ffe7a2"/></linearGradient></defs><path d="M20 2C22 18 38 34 38 54C38 68 30 78 20 78C10 78 2 68 2 54C2 34 18 18 20 2Z" fill="url(#fgc)"/><path d="M20 32C21 43 29 51 29 61C29 69 25 74 20 74C15 74 11 69 11 61C11 51 19 43 20 32Z" fill="#fff6dc" opacity=".92"/></svg></div></div>
        <svg class="l3ring" id="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="48"/><circle class="pg" id="rpg" cx="50" cy="50" r="48" pathLength="100"/></svg>
        <div class="smoke" id="smoke"></div>
        <div class="hit" id="chit" role="button" tabindex="0" aria-label="Tekan dan tahan lilin sampai padam"></div>
      </div>
      <div class="l3txt">
        <h3 class="t" id="l3t1">Ada hadiah kecil buat kamu...</h3>
        <p class="t" id="l3t2">Tapi sebelum dibuka, tiup lilinnya dulu 🎂</p>
        <p class="t h" id="l3t3">👆 Tekan &amp; tahan lilinnya sampai padam</p>
        <div class="l3toast" id="l3toast" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>
</section>
<script src="js/main.js"></script>
</body>
</html>
